<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica</title>
    <link rel="stylesheet" href="menu.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                 <div class="logo-text">
                    <h1>OFICINA</h1\>
                    <h2>MECÂNICA</h2>
                </div>
            </div>

            <nav class="menu">
                <a href="menu.html" class="menu-item active">
                    Início
                </a>
                <a href="clientes.html" class="menu-item">
                    Clientes
                </a>
                <a href="veiculos.html" class="menu-item">
                    Veículos
                </a>
                <a href="agendamento.html" class="menu-item">
                    Agendamento
                </a>
                <a href="servicos.html" class="menu-item">
                    Serviços
                </a>
            </nav>

            <div class="user">
                <div class="user-info">
                    <strong>Administrador</strong>
                    <span>Oficina</span>
                </div>
            </div>

        </aside>

        <header class="topo">
            <div class="topbar">
                <div>
                    <h1>Menu Principal</h1>
                    <p>Bem-vindo ao sistema da oficina mecânica</p>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="dashboard">
                <div class="card">
                    <a href="clientes.html">
                        <button type="button">
                            <h2>Clientes</h2>
                            <p>Gerenciar clientes</p>
                        </button>
                    </a>
                </div>

                <div class="card">
                    <a href="veiculos.html">
                        <button type="button">
                            <h2>Veículos</h2>
                            <p>Gerenciar veículos</p>
                        </button>
                    </a>
                </div>

                <div class="card">
                    <a href="agendamento.html">
                        <button type="button">
                            <h2>Agendamento</h2>
                            <p>Gerenciar agendamentos</p>
                        </button>
                    </a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
