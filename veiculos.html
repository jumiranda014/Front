<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos - Oficina Mecânica</title>
    <link rel="stylesheet" href="veiculos.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                 <div class="logo-text">
                    <h1>OFICINA</h1\>
                    <h2>MECÂNICA</h2>
                </div>
            </div>

            <nav class="menu">
                <a href="menu.html" class="menu-item">
                    Início
                </a>
                <a href="clientes.html" class="menu-item">
                    Clientes
                </a>
                <a href="veiculos.html" class="menu-item active">
                    Veículos
                </a>
                <a href="agendamento.html" class="menu-item">
                    Agendamento
                </a>
                <a href="servicos.html" class="menu-item">
                    Serviços
                </a>
            </nav>

            <div class="user">
                <div class="user-info">
                    <strong>Administrador</strong>
                    <span>Oficina</span>
                </div>
            </div>
        </aside>

        <main class="content">
            <h1>Veículos</h1>
            <section>
                <h2>Cadastrar Veículo</h2>
                <form>

                    <label>Cliente:</label>
                    <input type="text">

                    <label>Marca:</label>
                    <input type="text">

                    <label>Modelo:</label>
                    <input type="text">

                    <label>Ano:</label>
                    <input type="number">

                    <label>Placa:</label>
                    <input type="text">

                    <label>Cor:</label>
                    <input type="text">

                    <button type="submit">Cadastrar</button>

                </form>
                <a href="tabelaveiculos.html">
                   <button type="button">Ver veículos cadastrados</button>
                </a>
            </section>
        </main>
    </div>
</body>
</html>
