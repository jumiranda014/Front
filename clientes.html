<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Oficina Mecânica</title>
    <link rel="stylesheet" href="clientes.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                 <div class="logo-text">
                    <h1>OFICINA</h1\>
                    <h2>MECÂNICA</h2>
                </div>
            </div>

            <nav class="menu">

                <a href="menu.html" class="menu-item">
                    Início
                </a>

                <a href="clientes.html" class="menu-item active">
                    Clientes
                </a>

                <a href="veiculos.html" class="menu-item">
                    Veículos
                </a>

                <a href="agendamento.html" class="menu-item">
                    Agendamento
                </a>

                <a href="servicos.html" class="menu-item">
                    Serviços
                </a>

            </nav>

            <div class="user">
                <div class="user-info">
                    <strong>Administrador</strong>
                    <span>Oficina</span>
                </div>
            </div>

        </aside>


        <main class="content">

            <h1>Clientes</h1>

            <section>

                <h2>Cadastrar Cliente</h2>

                <form>

                    <label>Nome:</label>
                    <input type="text">

                    <label>CPF:</label>
                    <input type="text">

                    <label>Telefone:</label>
                    <input type="text">

                    <label>E-mail:</label>
                    <input type="email">

                    <label>Endereço:</label>
                    <input type="text">

                    <button type="submit">Cadastrar</button>

                </form>
                <a href="tabela.html">
                <button type="button">Ver clientes cadastrados</button>
                </a>

            </section>

        </main>

    </div>

</html>
